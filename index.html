<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Tripting</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2dc;--pri:#1f6f5c;--pri-ink:#fff;--ok:#1f7a3a;--bad:#b3261e;--warn:#a15c00;--chip:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#121412;--card:#1c1f1d;--ink:#ecebe6;--muted:#9a9a94;--line:#2c302d;--pri:#4fb898;--pri-ink:#0b1a15;--ok:#6fcf8a;--bad:#ff8a80;--warn:#f0b35a;--chip:#262a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;max-width:640px;margin:0 auto}
header h1{font-size:19px;margin:0;flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .err{color:var(--bad)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .lbl{font-size:12px;color:var(--muted)} .stat .val{font-size:19px;font-weight:650;margin-top:2px}
h2{font-size:15px;margin:18px 0 8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer}
.btn.primary{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.btn.danger{color:var(--bad)} .btn.sm{padding:6px 10px;font-size:13px} .btn.block{width:100%}
.btn:disabled{opacity:.55}
.icon{background:none;border:0;color:var(--muted);font-size:13px;padding:6px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-ink)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.field{display:block;margin-bottom:12px}.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none}
.grow{flex:1;min-width:0}.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip)}
.right{text-align:right}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;padding:12px 0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--pri);font-weight:650}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:72px;width:54px;height:54px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;margin-bottom:12px}.sheet-head h3{flex:1;margin:0;font-size:17px}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:var(--chip);margin-top:6px}
.photo-big{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--chip)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.login .card{width:100%;max-width:340px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.strike{text-decoration:line-through;opacity:.55}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .chip{flex:1;text-align:center;padding:9px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* ====== KONFIGURASI: tempel URL Web App Apps Script (berakhiran /exec) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbznmHTfT5ZR2JfV3lzM-Zj10aH0qfRiv9zLbfvfdrvDBal2FiyTMifS_laaIukbhQJS/exec';

const { useState, useEffect, useMemo, useRef } = React;
const N = v => Number(v) || 0;
const rp = n => 'Rp' + new Intl.NumberFormat('id-ID').format(Math.round(N(n)));
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const umur = tgl => {
  if (!tgl) return 0;
  const h = (new Date(todayStr()) - new Date(String(tgl).slice(0, 10))) / 86400000;
  return Number.isFinite(h) ? Math.max(0, Math.floor(h)) : 0;
};
const tglPendek = t => {
  if (!t) return '';
  const s = String(t).slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return String(t);
  const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`;
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
store.del('tr_pin'); // versi lama menyimpan PIN di perangkat; sekarang hanya token sesi
/* ID unik per formulir: kirim ulang formulir yang sama (mis. sinyal putus) tidak akan tercatat dobel */
const newRid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);

const KATEGORI_BARANG = ['Kaos', 'Kemeja', 'Jaket', 'Sweater', 'Celana', 'Rok/Dress', 'Sepatu', 'Tas', 'Topi', 'Aksesoris', 'Lainnya'];
const KONDISI = ['Seperti baru', 'Baik', 'Ada minus'];
const KANAL = ['Instagram', 'Facebook', 'TikTok', 'WhatsApp', 'Marketplace', 'Langsung'];
const AKUN = ['Tunai', 'Rekening'];
const KAT_KAS = { Masuk: ['Setoran Modal', 'Pemasukan Lain'], Keluar: ['Operasional', 'Ongkir', 'Upah', 'Setor ke Pemilik', 'Pengeluaran Lain'] };
const STATUS_WARNA = { Tersedia: 'ok', Dipesan: 'warn', Terjual: 'muted', Rusak: 'bad', Batal: 'bad', Lunas: 'ok', 'Menunggu COD': 'warn', Retur: 'bad' };

class ApiError extends Error {
  constructor(msg, code, net) { super(msg); this.code = code || ''; this.net = !!net; }
}

/* extra = { pin } hanya untuk aksi 'login'. Aksi lain memakai token sesi. */
async function api(action, data, extra) {
  if (API_URL.indexOf('http') !== 0) throw new ApiError('API_URL belum diisi di index.html', 'CONFIG');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 45000);
  let j;
  try {
    const res = await fetch(API_URL, {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: store.get('tr_token'), data, ...extra })
    });
    j = await res.json();
  } catch (e) {
    throw new ApiError(e.name === 'AbortError' ? 'Koneksi terlalu lambat (lebih dari 45 detik).' : 'Tidak bisa terhubung ke server. Periksa sinyal internet.', 'NET', true);
  } finally { clearTimeout(timer); }
  if (!j.ok) throw new ApiError(j.error || 'Gagal', j.code);
  return j.data;
}

function compress(file, max = 1200, q = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => reject(new Error('Gambar tidak bisa dibaca'));
    img.src = url;
  });
}

/* ====== Komponen dasar ====== */
const Field = ({ label, children, hint }) => <label className="field"><span>{label}</span>{children}{hint && <small className="muted">{hint}</small>}</label>;
const Tag = ({ s }) => <span className={'tag ' + (STATUS_WARNA[s] || '')}>{s}</span>;

function Sel({ value, onChange, options, placeholder }) {
  return <select value={value} onChange={e => onChange(e.target.value)}>
    {placeholder !== undefined && <option value="">{placeholder}</option>}
    {options.map(o => typeof o === 'string' ? <option key={o} value={o}>{o}</option> : <option key={o.value} value={o.value}>{o.label}</option>)}
  </select>;
}

function Seg({ value, onChange, options }) {
  return <div className="seg">{options.map(o => <button type="button" key={o} className={'chip' + (value === o ? ' on' : '')} onClick={() => onChange(o)}>{o}</button>)}</div>;
}

function Photo({ label, value, onChange, hint }) {
  const [busy, setBusy] = useState(false);
  const pick = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    setBusy(true); try { onChange(await compress(f)); } catch (x) { alert(x.message); } setBusy(false);
  };
  return <Field label={label} hint={hint}>
    <input type="file" accept="image/*" onChange={pick} />
    {busy && <small className="muted">Memproses foto…</small>}
    {value && <img className="preview" src={value} alt="" />}
  </Field>;
}

/* Input rupiah: hanya digit yang disimpan, tampilan diberi titik ribuan. Mencegah "50.000" terbaca sebagai 50. */
function Rupiah({ value, onChange, ...rest }) {
  const digit = String(value === undefined || value === null ? '' : value).replace(/\D/g, '').slice(0, 12);
  return <input type="text" inputMode="numeric" autoComplete="off" placeholder="0" {...rest}
    value={digit ? new Intl.NumberFormat('id-ID').format(Number(digit)) : ''}
    onChange={e => onChange(e.target.value.replace(/\D/g, '').slice(0, 12))} />;
}

/* Guard kirim ganda yang sinkron (ref), bukan menunggu render ulang state */
function useBusy() {
  const [busy, setBusy] = useState(false);
  const lock = useRef(false);
  const run = async fn => {
    if (lock.current) return;
    lock.current = true; setBusy(true);
    let ok = false;
    try { ok = await fn(); } finally { if (!ok) { lock.current = false; setBusy(false); } }
  };
  return [busy, run];
}

function Sheet({ title, onClose, closeOnBg, children }) {
  return <div className="sheet-bg" onClick={closeOnBg ? onClose : undefined}>
    <div className="sheet" onClick={e => e.stopPropagation()}>
      <div className="sheet-head"><h3>{title}</h3><button className="icon" onClick={onClose}>Tutup</button></div>
      {children}
    </div>
  </div>;
}

function useForm(init) {
  const [f, setF] = useState(() => ({ ...init, rid: newRid() }));
  const set = k => v => setF(p => ({ ...p, [k]: v && v.target ? v.target.value : v }));
  return [f, set, setF];
}

function Submit({ busy, label }) {
  return <button className="btn primary block" disabled={busy}>{busy ? 'Menyimpan…' : label}</button>;
}

/* ====== Form ====== */
function FormBarang({ barang, user, act }) {
  const edit = !!barang;
  const [f, set] = useForm(edit ? { ...barang, foto: '' } : { tgl_beli: todayStr(), akun: 'Tunai', kategori: '', kondisi: 'Baik', harga_beli: '', harga_target: '' });
  const [busy, run] = useBusy();
  const buktiWajib = user.role !== 'admin' && f.akun === 'Rekening' && N(f.harga_beli) > 0;
  const submit = e => { e.preventDefault(); run(() => act(edit ? 'ubahBarang' : 'tambahBarang', f, edit ? 'Barang diperbarui' : 'Barang ditambahkan')); };
  return <form onSubmit={submit}>
    <Photo label={edit ? 'Ganti foto (opsional)' : 'Foto barang *'} value={f.foto} onChange={set('foto')} />
    <Field label="Nama barang *"><input value={f.nama || ''} onChange={set('nama')} placeholder="mis. Jaket denim Levi's" /></Field>
    <div className="grid2">
      <Field label="Kategori"><Sel value={f.kategori || ''} onChange={set('kategori')} options={KATEGORI_BARANG} placeholder="Pilih" /></Field>
      <Field label="Ukuran"><input value={f.ukuran || ''} onChange={set('ukuran')} placeholder="M / 42 / dll" /></Field>
    </div>
    <Field label="Kondisi"><Sel value={f.kondisi || ''} onChange={set('kondisi')} options={KONDISI} /></Field>
    <Field label="Dibeli dari (penjual)"><input value={f.sumber || ''} onChange={set('sumber')} /></Field>
    {!edit && <>
      <div className="grid2">
        <Field label="Tanggal beli"><input type="date" value={f.tgl_beli} onChange={set('tgl_beli')} /></Field>
        <Field label="Harga beli *"><Rupiah value={f.harga_beli} onChange={set('harga_beli')} /></Field>
      </div>
      <Field label="Dibayar dari"><Seg value={f.akun} onChange={set('akun')} options={AKUN} /></Field>
      <Photo label={buktiWajib ? 'Bukti bayar *' : 'Bukti bayar (opsional)'} value={f.bukti} onChange={set('bukti')} hint={user.role !== 'admin' ? 'Wajib bila dibayar dari Rekening (screenshot transfer). Dari Tunai boleh dikosongkan.' : 'Screenshot transfer / foto nota bila ada'} />
    </>}
    <Field label="Target harga jual"><Rupiah value={f.harga_target} onChange={set('harga_target')} /></Field>
    <Field label="Catatan"><textarea rows="2" value={f.catatan || ''} onChange={set('catatan')} /></Field>
    <Submit busy={busy} label={edit ? 'Simpan perubahan' : 'Simpan barang'} />
  </form>;
}

function FormJual({ data, kode, user, act }) {
  const tersedia = data.barang.filter(b => b.status === 'Tersedia');
  const awal = tersedia.find(b => b.kode === kode);
  const targetOf = x => (x && N(x.harga_target) > 0 ? x.harga_target : '');   // target 0 = belum diisi → kolom dikosongkan
  const [f, set] = useForm({ kode: kode || '', harga_jual: targetOf(awal), metode: 'Transfer', kanal: 'Instagram', ongkir: '', akun_ongkir: 'Tunai', tgl: todayStr() });
  const [busy, run] = useBusy();
  const staf = user.role !== 'admin';
  const b = tersedia.find(x => x.kode === f.kode);
  // harga jual ikut target barang yang baru dipilih, kecuali sudah diketik manual
  const pilihBarang = v => {
    const baru = tersedia.find(x => x.kode === v);
    if (baru && (!f.harga_jual || String(f.harga_jual) === String(targetOf(b)))) set('harga_jual')(targetOf(baru));
    set('kode')(v);
  };
  const submit = e => { e.preventDefault(); run(() => act('tambahPenjualan', f, 'Penjualan dicatat')); };
  return <form onSubmit={submit}>
    <Field label="Barang *"><Sel value={f.kode} onChange={pilihBarang} placeholder="Pilih barang tersedia" options={tersedia.map(x => ({ value: x.kode, label: `${x.kode} · ${x.nama}${x.ukuran ? ' (' + x.ukuran + ')' : ''}` }))} /></Field>
    {b && <p className="small muted" style={{ marginTop: -6 }}>Modal {rp(b.harga_beli)} · target {rp(b.harga_target)}</p>}
    <Field label="Metode bayar"><Seg value={f.metode} onChange={set('metode')} options={['Transfer', 'COD', 'Tunai']} /></Field>
    <Field label="Harga jual *"><Rupiah value={f.harga_jual} onChange={set('harga_jual')} /></Field>
    {b && N(f.harga_jual) > 0 && <p className={'small ' + (N(f.harga_jual) - N(b.harga_beli) - N(f.ongkir) >= 0 ? 'ok' : 'bad')} style={{ marginTop: -6 }}>Perkiraan laba: {rp(N(f.harga_jual) - N(b.harga_beli) - N(f.ongkir))}</p>}
    <div className="grid2">
      <Field label="Kanal"><Sel value={f.kanal} onChange={set('kanal')} options={KANAL} /></Field>
      <Field label="Tanggal"><input type="date" value={f.tgl} onChange={set('tgl')} /></Field>
    </div>
    <div className="grid2">
      <Field label="Nama pembeli"><input value={f.pembeli || ''} onChange={set('pembeli')} /></Field>
      <Field label="Kontak"><input value={f.kontak || ''} onChange={set('kontak')} placeholder="@ig / no WA" /></Field>
    </div>
    <div className="grid2">
      <Field label="Ongkir ditanggung toko" hint="Kosongkan bila dibayar pembeli"><Rupiah value={f.ongkir} onChange={set('ongkir')} /></Field>
      <Field label="Ongkir dibayar dari"><Sel value={f.akun_ongkir} onChange={set('akun_ongkir')} options={AKUN} /></Field>
    </div>
    {N(f.ongkir) > 0 && <Photo label={staf ? 'Bukti ongkir *' : 'Bukti ongkir (opsional)'} value={f.bukti_ongkir} onChange={set('bukti_ongkir')} hint="Foto resi / nota ekspedisi" />}
    {f.metode === 'Transfer' && <Photo label={staf ? 'Bukti transfer *' : 'Bukti transfer (opsional)'} value={f.bukti} onChange={set('bukti')} />}
    {f.metode === 'COD' && <p className="small warn">COD dicatat sebagai "Menunggu COD". Uang baru masuk kas saat dikonfirmasi cair.</p>}
    <Field label="Catatan"><input value={f.catatan || ''} onChange={set('catatan')} placeholder="No resi, dll" /></Field>
    <Submit busy={busy} label="Simpan penjualan" />
  </form>;
}

function FormCOD({ p, user, act }) {
  const [f, set] = useForm({ id: p.id, hasil: 'Lunas', diterima: p.harga_jual, akun: 'Rekening', biaya_retur: '' });
  const [busy, run] = useBusy();
  const staf = user.role !== 'admin';
  // satu field "bukti" di server; di formulir dipisah supaya bukti pencairan tidak terbawa jadi bukti biaya retur
  const submit = e => {
    e.preventDefault();
    const { bukti_cair, bukti_retur, ...sisa } = f;
    run(() => act('konfirmasiCOD', { ...sisa, bukti: f.hasil === 'Lunas' ? bukti_cair : bukti_retur }, 'COD dikonfirmasi'));
  };
  return <form onSubmit={submit}>
    <p className="small muted">{p.kode} · {p.pembeli || '-'} · harga {rp(p.harga_jual)}</p>
    <Field label="Hasil"><Seg value={f.hasil} onChange={set('hasil')} options={['Lunas', 'Retur']} /></Field>
    {f.hasil === 'Lunas' ? <>
      <Field label="Uang diterima bersih *" hint="Setelah dipotong biaya COD/ekspedisi"><Rupiah value={f.diterima} onChange={set('diterima')} /></Field>
      {N(f.diterima) > N(p.harga_jual) && <p className="small warn" style={{ marginTop: -6 }}>Uang diterima lebih besar dari harga jual. Pastikan angkanya benar.</p>}
      <Field label="Masuk ke"><Seg value={f.akun} onChange={set('akun')} options={AKUN} /></Field>
      <Photo label={staf ? 'Bukti pencairan *' : 'Bukti pencairan (opsional)'} value={f.bukti_cair} onChange={set('bukti_cair')} />
    </> : <>
      <Field label="Alasan retur *"><input value={f.alasan || ''} onChange={set('alasan')} /></Field>
      <Field label="Biaya retur (bila ada)"><Rupiah value={f.biaya_retur} onChange={set('biaya_retur')} /></Field>
      {N(f.biaya_retur) > 0 && <>
        <Field label="Biaya dibayar dari"><Seg value={f.akun} onChange={set('akun')} options={AKUN} /></Field>
        <Photo label={staf ? 'Bukti biaya retur *' : 'Bukti biaya retur (opsional)'} value={f.bukti_retur} onChange={set('bukti_retur')} hint="Foto resi / nota ekspedisi" />
      </>}
      <p className="small muted">Barang kembali berstatus Tersedia.</p>
    </>}
    <Submit busy={busy} label="Konfirmasi" />
  </form>;
}

function FormKas({ user, act }) {
  const [f, set, setF] = useForm({ jenis: 'Keluar', akun: 'Tunai', kategori: '', tgl: todayStr(), dari: 'Tunai', ke: 'Rekening' });
  const [busy, run] = useBusy();
  const kats = f.jenis === 'Pindah' ? [] : KAT_KAS[f.jenis].concat(user.role === 'admin' ? ['Penyesuaian'] : []);
  const submit = e => { e.preventDefault(); run(() => act('tambahKas', f, 'Kas dicatat')); };
  return <form onSubmit={submit}>
    <Field label="Jenis"><Seg value={f.jenis} onChange={v => setF(p => ({ ...p, jenis: v, kategori: '' }))} options={['Masuk', 'Keluar', 'Pindah']} /></Field>
    {f.jenis === 'Pindah' ? <div className="grid2">
      <Field label="Dari"><Sel value={f.dari} onChange={set('dari')} options={AKUN} /></Field>
      <Field label="Ke"><Sel value={f.ke} onChange={set('ke')} options={AKUN} /></Field>
    </div> : <>
      <Field label="Akun"><Seg value={f.akun} onChange={set('akun')} options={AKUN} /></Field>
      <Field label="Kategori *"><Sel value={f.kategori} onChange={set('kategori')} options={kats} placeholder="Pilih" /></Field>
    </>}
    <div className="grid2">
      <Field label="Nominal *"><Rupiah value={f.nominal} onChange={set('nominal')} /></Field>
      <Field label="Tanggal"><input type="date" value={f.tgl} onChange={set('tgl')} /></Field>
    </div>
    <Field label="Keterangan *"><input value={f.keterangan || ''} onChange={set('keterangan')} /></Field>
    <Photo label={user.role !== 'admin' ? 'Bukti *' : 'Bukti (opsional)'} value={f.bukti} onChange={set('bukti')} hint={user.role !== 'admin' ? 'Wajib untuk semua catatan kas: foto nota, screenshot transfer, atau slip setoran.' : undefined} />
    <Submit busy={busy} label="Simpan" />
  </form>;
}

/* ====== Halaman ====== */
function hitung({ barang, penjualan, kas }) {
  const saldo = { Tunai: 0, Rekening: 0 };
  kas.filter(k => k.status !== 'Batal').forEach(k => { saldo[k.akun] = (saldo[k.akun] || 0) + (k.jenis === 'Masuk' ? 1 : -1) * N(k.nominal); });
  const bmap = Object.fromEntries(barang.map(b => [b.kode, b]));
  const ym = todayStr().slice(0, 7);
  const tersedia = barang.filter(b => b.status === 'Tersedia');
  const lunasBln = penjualan.filter(p => p.status === 'Lunas' && String(p.tgl_lunas).startsWith(ym));
  const labaOf = p => N(p.diterima) - N(bmap[p.kode] && bmap[p.kode].harga_beli) - N(p.ongkir);
  const cod = penjualan.filter(p => p.status === 'Menunggu COD');
  return {
    saldo, total: saldo.Tunai + saldo.Rekening, bmap,
    stok: tersedia.length, nilaiStok: sum(barang.filter(b => b.status === 'Tersedia' || b.status === 'Dipesan'), b => N(b.harga_beli)),
    terjualBln: lunasBln.length, omzetBln: sum(lunasBln, p => N(p.diterima)), labaBln: sum(lunasBln, labaOf),
    belanjaBln: sum(barang.filter(b => b.status !== 'Batal' && String(b.tgl_beli).startsWith(ym)), b => N(b.harga_beli)),
    cod, codNominal: sum(cod, p => N(p.harga_jual)),
    lama: tersedia.filter(b => umur(b.tgl_beli) >= 30).sort((a, b) => umur(b.tgl_beli) - umur(a.tgl_beli)),
    labaOf
  };
}

function Ringkasan({ data, s, open }) {
  const Stat = ({ l, v, c }) => <div className="card stat" style={{ marginBottom: 0 }}><div className="lbl">{l}</div><div className={'val ' + (c || '')}>{v}</div></div>;
  return <div>
    {data.peringatan && data.peringatan.length > 0 && <div className="card" style={{ borderColor: 'var(--bad)' }}>
      <b className="bad">Data di Sheet perlu diperiksa ({data.peringatan.length})</b>
      {data.peringatan.slice(0, 6).map((w, i) => <div key={i} className="small" style={{ padding: '4px 0' }}>{w}</div>)}
      {data.peringatan.length > 6 && <div className="small muted">…dan {data.peringatan.length - 6} lainnya.</div>}
    </div>}
    <h2>Saldo</h2>
    <div className="grid2">
      <Stat l="Tunai" v={rp(s.saldo.Tunai)} c={s.saldo.Tunai < 0 ? 'bad' : ''} />
      <Stat l="Rekening" v={rp(s.saldo.Rekening)} c={s.saldo.Rekening < 0 ? 'bad' : ''} />
    </div>
    <p className="small muted">Total {rp(s.total)}. Cocokkan dengan uang fisik & mutasi bank tiap minggu.</p>
    <h2>Bulan ini</h2>
    <div className="grid2">
      <Stat l="Terjual" v={s.terjualBln + ' pcs'} />
      <Stat l="Pemasukan penjualan" v={rp(s.omzetBln)} />
      <Stat l="Laba kotor" v={rp(s.labaBln)} c={s.labaBln < 0 ? 'bad' : 'ok'} />
      <Stat l="Belanja barang" v={rp(s.belanjaBln)} />
    </div>
    <h2>Stok</h2>
    <div className="grid2">
      <Stat l="Barang tersedia" v={s.stok + ' pcs'} />
      <Stat l="Modal tertahan" v={rp(s.nilaiStok)} />
    </div>
    {s.cod.length > 0 && <div className="card" style={{ marginTop: 12 }}>
      <b className="warn">{s.cod.length} COD belum cair · {rp(s.codNominal)}</b>
      {s.cod.map(p => <div key={p.id} className="row small"><span>{p.kode} · {p.pembeli || '-'}</span><span className="muted">{umur(p.tgl)} hari</span></div>)}
    </div>}
    {s.lama.length > 0 && <div className="card">
      <b>Belum laku ≥ 30 hari ({s.lama.length})</b>
      {s.lama.slice(0, 8).map(b => <div key={b.kode} className="row small" onClick={() => open({ t: 'barang', b })} style={{ cursor: 'pointer' }}><span className="trunc">{b.kode} · {b.nama}</span><span className="muted">{umur(b.tgl_beli)} hari</span></div>)}
    </div>}
    {data.log.length > 0 && <>
      <h2>Aktivitas terbaru</h2>
      <div className="card">{data.log.slice(0, 15).map((l, i) => <div key={i} className="small" style={{ padding: '5px 0', borderBottom: '1px solid var(--line)' }}>
        <span className="muted">{l.waktu} · {l.user}</span><br /><b>{l.aksi}</b> {String(l.detail).slice(0, 140)}
      </div>)}</div>
    </>}
  </div>;
}

function BarangList({ data, open }) {
  const [q, setQ] = useState(''); const [st, setSt] = useState('Tersedia');
  const list = data.barang.filter(b => (st === 'Semua' ? b.status !== 'Batal' : b.status === st))
    .filter(b => !q || (b.kode + ' ' + b.nama + ' ' + b.kategori + ' ' + b.ukuran).toLowerCase().includes(q.toLowerCase()))
    .slice().reverse();
  return <div>
    <input placeholder="Cari kode, nama, kategori, ukuran…" value={q} onChange={e => setQ(e.target.value)} style={{ marginBottom: 10 }} />
    <div className="chips">{['Tersedia', 'Dipesan', 'Terjual', 'Rusak', 'Semua'].map(x =>
      <button key={x} className={'chip' + (st === x ? ' on' : '')} onClick={() => setSt(x)}>{x} ({x === 'Semua' ? data.barang.filter(b => b.status !== 'Batal').length : data.barang.filter(b => b.status === x).length})</button>)}</div>
    <div className="card">{list.length === 0 ? <p className="muted">Tidak ada barang.</p> : list.map(b =>
      <div key={b.kode} className="item" onClick={() => open({ t: 'barang', b })}>
        {b.foto ? <img className="thumb" src={b.foto} alt="" loading="lazy" /> : <div className="thumb" />}
        <div className="grow"><div className="trunc"><b>{b.nama}</b></div>
          <div className="small muted">{b.kode} · {b.kategori || '-'} {b.ukuran && '· ' + b.ukuran}</div>
          <div className="small">Modal {rp(b.harga_beli)} · target {rp(b.harga_target)}</div></div>
        <div className="right small"><Tag s={b.status} />{b.status === 'Tersedia' && <div className="muted">{umur(b.tgl_beli)} hr</div>}</div>
      </div>)}</div>
  </div>;
}

function DetailBarang({ b, data, user, open, act }) {
  const jual = data.penjualan.filter(p => p.kode === b.kode);
  const statusTo = async to => { const alasan = prompt(`Alasan ubah ke ${to}:`); if (alasan) await act('statusBarang', { kode: b.kode, status: to, alasan }, 'Status diubah'); };
  const batal = async () => { const alasan = prompt('Alasan membatalkan barang ini (pembelian di kas ikut dibatalkan):'); if (alasan) await act('batalkan', { jenis: 'Barang', id: b.kode, alasan }, 'Barang dibatalkan'); };
  return <div>
    {b.foto && <img className="photo-big" src={b.foto} alt="" />}
    <div className="card" style={{ marginTop: 12 }}>
      <div className="row"><b>{b.nama}</b><Tag s={b.status} /></div>
      {[['Kode', b.kode], ['Kategori', b.kategori], ['Ukuran', b.ukuran], ['Kondisi', b.kondisi], ['Dibeli dari', b.sumber], ['Tanggal beli', tglPendek(b.tgl_beli) + ' (' + umur(b.tgl_beli) + ' hari)'], ['Harga beli', rp(b.harga_beli)], ['Target jual', rp(b.harga_target)], ['Diinput', b.dibuat_oleh + ' · ' + b.dibuat_pada], ['Catatan', b.catatan]]
        .filter(r => r[1]).map(r => <div key={r[0]} className="row small"><span className="muted">{r[0]}</span><span className="right">{r[1]}</span></div>)}
    </div>
    {jual.length > 0 && <div className="card"><b className="small">Riwayat penjualan</b>{jual.map(p => <div key={p.id} className="row small"><span>{tglPendek(p.tgl)} · {p.metode} · {rp(p.harga_jual)}</span><Tag s={p.status} /></div>)}</div>}
    <div className="actions">
      {b.status === 'Tersedia' && <button className="btn primary" onClick={() => open({ t: 'jual', kode: b.kode })}>Jual</button>}
      {b.status !== 'Batal' && <button className="btn" onClick={() => open({ t: 'editBarang', b })}>Edit</button>}
      {b.status === 'Tersedia' && <button className="btn" onClick={() => statusTo('Rusak')}>Tandai rusak</button>}
      {b.status === 'Rusak' && <button className="btn" onClick={() => statusTo('Tersedia')}>Kembalikan tersedia</button>}
      {user.role === 'admin' && ['Tersedia', 'Rusak'].includes(b.status) && <button className="btn danger" onClick={batal}>Batalkan</button>}
    </div>
  </div>;
}

function PenjualanList({ data, s, user, open, act }) {
  const [st, setSt] = useState('Semua');
  const list = data.penjualan.filter(p => st === 'Semua' ? true : p.status === st).slice().reverse();
  const batal = async p => { const alasan = prompt('Alasan membatalkan penjualan (barang kembali tersedia, kas ikut batal):'); if (alasan) await act('batalkan', { jenis: 'Penjualan', id: p.id, alasan }, 'Penjualan dibatalkan'); };
  return <div>
    {s.cod.length > 0 && <div className="card">
      <b className="warn">Menunggu COD ({s.cod.length})</b>
      {s.cod.map(p => <div key={p.id} className="item" style={{ cursor: 'default' }}>
        <div className="grow"><div className="trunc"><b>{p.kode}</b> · {s.bmap[p.kode] ? s.bmap[p.kode].nama : ''}</div>
          <div className="small muted">{p.pembeli || '-'} · {rp(p.harga_jual)} · {umur(p.tgl)} hari</div></div>
        <button className="btn sm primary" onClick={() => open({ t: 'cod', p })}>Konfirmasi</button>
      </div>)}
    </div>}
    <div className="chips">{['Semua', 'Lunas', 'Menunggu COD', 'Retur', 'Batal'].map(x => <button key={x} className={'chip' + (st === x ? ' on' : '')} onClick={() => setSt(x)}>{x}</button>)}</div>
    <div className="card">{list.length === 0 ? <p className="muted">Belum ada penjualan.</p> : list.map(p => {
      const b = s.bmap[p.kode];
      return <div key={p.id} className={'item' + (p.status === 'Batal' ? ' strike' : '')} style={{ cursor: 'default' }}>
        {b && b.foto ? <img className="thumb" src={b.foto} alt="" loading="lazy" /> : <div className="thumb" />}
        <div className="grow"><div className="trunc"><b>{b ? b.nama : p.kode}</b></div>
          <div className="small muted">{tglPendek(p.tgl)} · {p.kanal} · {p.metode} · {p.pembeli || '-'}</div>
          <div className="small">{rp(p.harga_jual)}{p.status === 'Lunas' && <span className={s.labaOf(p) >= 0 ? 'ok' : 'bad'}> · laba {rp(s.labaOf(p))}</span>}
            {p.bukti && <> · <a href={p.bukti} target="_blank" rel="noopener noreferrer">bukti</a></>}</div></div>
        <div className="right small"><Tag s={p.status} />
          {user.role === 'admin' && p.status !== 'Batal' && <div><button className="icon" onClick={() => batal(p)}>batalkan</button></div>}</div>
      </div>;
    })}</div>
  </div>;
}

function KasList({ data, s, user, act }) {
  const [akun, setAkun] = useState('Semua');
  const list = data.kas.filter(k => akun === 'Semua' || k.akun === akun).slice().reverse();
  const batal = async k => { const alasan = prompt('Alasan membatalkan transaksi ini:'); if (alasan) await act('batalkan', { jenis: 'Kas', id: k.id, alasan }, 'Transaksi dibatalkan'); };
  return <div>
    <div className="grid2" style={{ marginBottom: 12 }}>
      {AKUN.map(a => <div key={a} className="card stat" style={{ marginBottom: 0 }}><div className="lbl">{a}</div><div className="val">{rp(s.saldo[a])}</div></div>)}
    </div>
    <div className="chips">{['Semua', ...AKUN].map(x => <button key={x} className={'chip' + (akun === x ? ' on' : '')} onClick={() => setAkun(x)}>{x}</button>)}</div>
    <div className="card">{list.length === 0 ? <p className="muted">Belum ada transaksi.</p> : list.map(k =>
      <div key={k.id} className={'item' + (k.status === 'Batal' ? ' strike' : '')} style={{ cursor: 'default' }}>
        <div className="grow"><div className="trunc"><b>{k.kategori}</b> · <span className="small">{k.keterangan}</span></div>
          <div className="small muted">{tglPendek(k.tgl)} · {k.akun} · {k.dibuat_oleh}{k.bukti && <> · <a href={k.bukti} target="_blank" rel="noopener noreferrer">bukti</a></>}</div></div>
        <div className="right"><b className={k.jenis === 'Masuk' ? 'ok' : 'bad'}>{k.jenis === 'Masuk' ? '+' : '−'}{rp(k.nominal)}</b>
          {user.role === 'admin' && k.status !== 'Batal' && (!k.ref || k.kategori === 'Pindah Saldo') && <div><button className="icon" onClick={() => batal(k)}>batalkan</button></div>}</div>
      </div>)}</div>
  </div>;
}

/* ====== App ====== */
function Login({ onLogin }) {
  const [pin, setPin] = useState(''); const [err, setErr] = useState(''); const [busy, run] = useBusy();
  const go = e => {
    e.preventDefault(); setErr('');
    run(async () => {
      try { const r = await api('login', {}, { pin }); store.set('tr_token', r.token); onLogin(r); return true; }
      catch (x) { setErr(x.message); setPin(''); return false; }
    });
  };
  return <div className="login"><form className="card" onSubmit={go}>
    <h1 style={{ marginTop: 0 }}>Tripting</h1>
    <Field label="PIN"><input type="password" inputMode="numeric" autoComplete="off" maxLength={6} value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, 6))} autoFocus /></Field>
    {err && <p className="err small">{err}</p>}
    <button className="btn primary block" disabled={busy || pin.length !== 6}>{busy ? 'Memeriksa…' : 'Masuk'}</button>
  </form></div>;
}

function App() {
  const [user, setUser] = useState(null);
  const [data, setData] = useState(null);
  const [tab, setTab] = useState('Ringkasan');
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState('');
  const [loading, setLoading] = useState(false);
  const [boot, setBoot] = useState(!!store.get('tr_token'));
  const [gagalMuat, setGagalMuat] = useState('');

  const notify = m => { setToast(m); setTimeout(() => setToast(''), 2600); };
  const keluarLokal = () => { store.del('tr_token'); setUser(null); setData(null); setModal(null); setGagalMuat(''); setTab('Ringkasan'); };
  const load = async () => {
    setLoading(true);
    try { const d = await api('getAll'); setData(d); setUser(d.user); setGagalMuat(''); }
    catch (x) {
      // hanya sesi yang benar-benar berakhir yang mengeluarkan pengguna; gangguan jaringan/kunci login tidak
      if (x.code === 'SESI') keluarLokal(); else if (!data) setGagalMuat(x.message);
      notify(x.message);
    }
    setLoading(false); setBoot(false);
  };
  useEffect(() => { if (store.get('tr_token')) load(); }, []);

  const act = async (action, payload, okMsg) => {
    try { await api(action, payload); }
    catch (x) {
      if (x.code === 'SESI') { keluarLokal(); notify(x.message); return false; }
      alert(x.net ? x.message + '\n\nPerubahan ini MUNGKIN sudah tersimpan. Tekan "Muat ulang" dan periksa dulu. Mengirim ulang dari formulir yang sama aman: tidak akan tercatat dobel.' : x.message);
      return false;
    }
    setModal(null); notify(okMsg); await load(); return true;
  };
  const s = useMemo(() => data ? hitung(data) : null, [data]);

  if (boot) return <div className="login muted">Memuat…</div>;
  if (!data && gagalMuat) return <div className="login"><div className="card">
    <p className="err">{gagalMuat}</p>
    <button className="btn primary block" onClick={load}>{loading ? 'Memuat…' : 'Coba lagi'}</button>
    <button className="btn block" style={{ marginTop: 8 }} onClick={keluarLokal}>Masuk ulang dengan PIN</button>
  </div></div>;
  if (!user) return <Login onLogin={u => { setUser({ nama: u.nama, role: u.role }); load(); }} />;
  if (!data) return <div className="login muted">Memuat data…</div>;

  const fabFor = { Barang: () => setModal({ t: 'tambahBarang' }), Penjualan: () => setModal({ t: 'jual' }), Kas: () => setModal({ t: 'kas' }) };
  const judul = { tambahBarang: 'Tambah barang', editBarang: 'Edit barang', barang: 'Detail barang', jual: 'Catat penjualan', cod: 'Konfirmasi COD', kas: 'Catat kas' };

  return <>
    <header>
      <h1>{tab}</h1>
      <span className="small muted">{user.nama}</span>
      <button className="icon" onClick={load}>{loading ? '…' : 'Muat ulang'}</button>
      <button className="icon" onClick={() => { api('keluar').catch(() => { }); keluarLokal(); }}>Keluar</button>
    </header>
    <div className="wrap">
      {tab === 'Ringkasan' && <Ringkasan data={data} s={s} open={setModal} />}
      {tab === 'Barang' && <BarangList data={data} open={setModal} />}
      {tab === 'Penjualan' && <PenjualanList data={data} s={s} user={user} open={setModal} act={act} />}
      {tab === 'Kas' && <KasList data={data} s={s} user={user} act={act} />}
    </div>
    {fabFor[tab] && <button className="fab" onClick={fabFor[tab]} aria-label="Tambah">+</button>}
    <nav className="tabs">{['Ringkasan', 'Barang', 'Penjualan', 'Kas'].map(t => <button key={t} className={tab === t ? 'on' : ''} onClick={() => setTab(t)}>{t}</button>)}</nav>
    {modal && <Sheet title={judul[modal.t]} onClose={() => setModal(null)} closeOnBg={modal.t === 'barang'}>
      {modal.t === 'tambahBarang' && <FormBarang user={user} act={act} />}
      {modal.t === 'editBarang' && <FormBarang barang={modal.b} user={user} act={act} />}
      {modal.t === 'barang' && <DetailBarang b={modal.b} data={data} user={user} open={setModal} act={act} />}
      {modal.t === 'jual' && <FormJual data={data} kode={modal.kode} user={user} act={act} />}
      {modal.t === 'cod' && <FormCOD p={modal.p} user={user} act={act} />}
      {modal.t === 'kas' && <FormKas user={user} act={act} />}
    </Sheet>}
    {toast && <div className="toast">{toast}</div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
